      <b>主题：</b>人格对应的是什么食物类型。<br/>
      <b>目的：</b>用 24 道有代入感的场景题，把你的性格映射成 6 种食物人格之一（火锅 / 抹茶 / 烧烤 / 甜点 / 螺蛳粉 / 沙拉），并找出隐藏款。<br/>
      <b>你将获得：</b>① 你的专属食物人格与称号标签；② 一张 6 维性格雷达图；③ 专属评语、深度分析与成长建议；④ 一句可发朋友圈的总结。
    </div>
    <button class="btn" id="start">开始测试 →</button>
  </div>`;
  document.getElementById('start').onclick=()=>{state.cur=0;renderQ();};
}

function renderQ(){
  const i=state.cur, q=DATA.questions[i], total=DATA.questions.length;
  const pct=Math.round((i/total)*100);
  const chosen=state.answers[q.id];
  app.innerHTML=`
  <div class="card">
    <div class="qnum">第 ${i+1} / ${total} 题</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qtext">${q.q}</div>
    ${q.options.map(o=>`<button class="opt ${chosen===o.id?'sel':''}" data-o="${o.id}">${o.text}</button>`).join('')}
    <div style="text-align:right;margin-top:6px">
      ${i>0?'<button class="btn" id="prev" style="background:#333">上一题</button> ':''}
      <button class="btn" id="next" ${chosen?'':'disabled'}>${i<total-1?'下一题 →':'查看结果 🎉'}</button>
    </div>
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    state.answers[q.id]=b.dataset.o; renderQ();
  });
  if(i>0) document.getElementById('prev').onclick=()=>{state.cur--;renderQ();};
  document.getElementById('next').onclick=()=>{
    if(!state.answers[q.id]) return;
    if(i<total-1){state.cur++;renderQ();} else renderResult();
  };
}

function compute(){
  const food={H:0,M:0,K:0,D:0,L:0,S:0};
  const dim={soc:0,heal:0,quirk:0,disc:0,thrill:0,art:0};
  const eggPicked=DATA.eggQuestions.every(qid=>{
    const q=DATA.questions.find(x=>x.id===qid);
    const oid=state.answers[qid]; const o=q.options.find(x=>x.id===oid);
    return o && o.egg;
  });
  DATA.questions.forEach(q=>{
    const oid=state.answers[q.id]; if(!oid) return;
    const o=q.options.find(x=>x.id===oid); if(!o) return;
    food[o.type]+=2;
    const w=DATA.typeDimWeights[o.type];
    for(const k in w) dim[k]+=w[k];
  });
  const norm={};
  for(const k in dim) norm[k]=Math.max(8,Math.min(100,Math.round(dim[k]/72*100)));
  return {food,dim:norm,egg:eggPicked};
}

const PROF=Object.fromEntries(TYPES.map(t=>[t,DATA.results[t].radarProfile]));
const DIMKEYS=DATA.dimensions.map(d=>d.key);
function dist(a,b){return Math.sqrt(DIMKEYS.reduce((s,k)=>s+(a[k]-b[k])*(a[k]-b[k]),0));}

function decide(r){
  if(r.egg) return "EGG";
  const max=Math.max(...TYPES.map(t=>r.food[t]));
  let tops=TYPES.filter(t=>r.food[t]===max);
  // 附加条件（同分微调）
  if(tops.includes("H")&&tops.includes("K")&&r.dim.soc>=r.dim.thrill) return "H";
  if(tops.includes("M")&&tops.includes("S")&&r.dim.art>=r.dim.disc) return "M";
  // 排除条件（重判）
  tops=tops.filter(t=> !(t==="S" && r.dim.disc<35) && !(t==="L" && r.dim.quirk<30));
  if(tops.length===0) return maxDimType(r.dim);
  if(tops.length===1) return tops[0];
  // 同分处理：在并列类型中取离「典型画像」最近的（6 维欧氏距离）
  tops.sort((a,b)=> dist(r.dim,PROF[a]) - dist(r.dim,PROF[b]));
  return tops[0];
}

function maxDimType(dim){
  let best=null,bv=-1;
  TYPES.forEach(t=>{
    const w=DATA.typeDimWeights[t]; let s=0;
    for(const k in w) s+=w[k]*dim[k];
    if(s>bv){bv=s;best=t;}
  });
  return best||"H";
}

function radarSVG(profile,user){
  const dims=DATA.dimensions, n=dims.length, cx=140, cy=130, R=100;
  const ang=i=>-Math.PI/2 + i*2*Math.PI/n;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  let grid="", axes="", labels="";
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts=dims.map((_,i)=>pt(i,R*f).join(",")).join(" ");
    grid+=`<polygon points="${pts}" fill="none" stroke="#2c3142" stroke-width="1"/>`;
  });
  dims.forEach((d,i)=>{
    const[ex,ey]=pt(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#2c3142" stroke-width="1"/>`;
    const[lx,ly]=pt(i,R+22);
    labels+=`<text x="${lx}" y="${ly}" fill="#9aa3b2" font-size="11" text-anchor="middle" dominant-baseline="middle">${d.name}</text>`;
  });
  const up=dims.map((d,i)=>pt(i,R*(user[d.key]/100)).join(",")).join(" ");
  const rp=dims.map((d,i)=>pt(i,R*(profile[d.key]/100)).join(",")).join(" ");
  const ul=dims.map((d,i)=>{const[x,y]=pt(i,R*(user[d.key]/100));return `<circle cx="${x}" cy="${y}" r="3" fill="#FF6B6B"/>`;}).join("");
  return `<svg class="radar" width="280" height="260" viewBox="0 0 280 260">
    ${grid}${axes}
    <polygon points="${rp}" fill="rgba(155,107,255,.18)" stroke="#9B6BFF" stroke-width="2"/>
    <polygon points="${up}" fill="rgba(255,107,107,.22)" stroke="#FF6B6B" stroke-width="2"/>
    ${ul}${labels}
  </svg>`;
}

function renderResult(){
  const r=compute();
  const key=decide(r);
  const res=DATA.results[key];
  const card=(k)=>{const o=DATA.results[k];return `<div class="res-sec" style="color:#9aa3b2;font-weight:600">「${o.name}」六维画像</div>`;};
  app.innerHTML=`
  <div class="card">
    <div class="res-emoji">${res.emoji}</div>
    <div class="res-name">${res.name}</div>
    <div class="res-comment">「${res.comment}」</div>
    <div class="tags">${res.tags.map(t=>`<span>${t}</span>`).join('')}</div>
    <div class="res-sec">你的六维性格雷达</div>
    ${radarSVG(res.radarProfile,r.dim)}
    <div style="text-align:center;color:#9aa3b2;font-size:12px">红=你，紫=该类型典型画像</div>
    <div class="res-sec">深度分析</div>
    <div class="res-body">${res.analysis}</div>
    <div class="res-sec">成长建议</div>
    <div class="res-body">${res.advice}</div>
    <div class="summary">「${res.summary}」</div>
    <div class="share">—— 把你的食物人格分享给朋友 ——<br/>
      <button class="btn" id="again">再测一次 ↻</button>
    </div>
  </div>`;
  document.getElementById('again').onclick=()=>{state.answers={};state.cur=0;renderIntro();};
}

renderIntro();
</script>
</body>
</html>
